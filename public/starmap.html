<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>STARMAP · Canvas 2D Background Demo</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				margin: 0;
			}

			body {
				overflow: hidden;
				background: #04060c;
				color: #cfe0f5;
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				-webkit-font-smoothing: antialiased;
				user-select: none;
			}

			/* ---------- 星云（纯 CSS，不占 canvas 绘制） ---------- */
			.nebula {
				position: fixed;
				inset: -25%;
				pointer-events: none;
				will-change: transform;
			}

			.nebula-a {
				background:
					radial-gradient(38% 42% at 30% 34%, rgba(28, 116, 172, 0.22), transparent 70%),
					radial-gradient(30% 30% at 64% 66%, rgba(92, 58, 176, 0.16), transparent 72%);
				animation: drift-a 52s ease-in-out infinite alternate;
			}

			.nebula-b {
				background:
					radial-gradient(26% 30% at 72% 24%, rgba(40, 158, 190, 0.13), transparent 70%),
					radial-gradient(34% 26% at 22% 72%, rgba(124, 70, 184, 0.12), transparent 74%);
				animation: drift-b 74s ease-in-out infinite alternate;
			}

			@keyframes drift-a {
				from {
					transform: translate3d(-1.5%, -1%, 0) scale(1.02);
				}
				to {
					transform: translate3d(2.2%, 1.6%, 0) scale(1.09);
				}
			}

			@keyframes drift-b {
				from {
					transform: translate3d(1.8%, 1.2%, 0) scale(1.06);
				}
				to {
					transform: translate3d(-1.6%, -1.4%, 0) scale(1);
				}
			}

			/* ---------- 画布 ---------- */
			#sky {
				position: fixed;
				inset: 0;
				display: block;
				width: 100%;
				height: 100%;
				animation: fade-in 1.4s ease both;
			}

			@keyframes fade-in {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}

			.vignette {
				position: fixed;
				inset: 0;
				pointer-events: none;
				background: radial-gradient(
					118% 88% at 50% 48%,
					transparent 32%,
					rgba(2, 3, 8, 0.5) 72%,
					rgba(2, 3, 8, 0.94) 100%
				);
			}

			/* ---------- HUD ---------- */
			.hud {
				position: fixed;
				z-index: 5;
				pointer-events: none;
				font-size: 0.6875rem;
				letter-spacing: 0.18em;
				text-transform: uppercase;
				line-height: 1;
			}

			.hud-tl {
				top: 1.6rem;
				left: 1.9rem;
				display: flex;
				align-items: baseline;
				gap: 0.75rem;
			}

			.hud-title {
				color: rgba(214, 234, 255, 0.92);
				font-size: 0.75rem;
				letter-spacing: 0.36em;
			}

			.hud-dim {
				color: rgba(150, 188, 226, 0.5);
			}

			.hud-bl {
				bottom: 1.6rem;
				left: 1.9rem;
				display: flex;
				align-items: baseline;
				gap: 0.45rem;
				color: rgba(180, 212, 245, 0.8);
			}

			.hud-sep {
				opacity: 0.35;
			}

			.hud-br {
				right: 1.9rem;
				bottom: 1.6rem;
				color: rgba(150, 188, 226, 0.45);
			}

			/* ---------- 悬浮标签 ---------- */
			.tip {
				position: fixed;
				top: 0;
				left: 0;
				z-index: 8;
				padding: 0.5rem 0.7rem 0.55rem;
				border: 1px solid rgba(120, 200, 255, 0.28);
				border-radius: 3px;
				background: rgba(6, 14, 24, 0.72);
				opacity: 0;
				transition: opacity 0.16s ease;
				pointer-events: none;
				white-space: nowrap;
				will-change: transform;
			}

			.tip.on {
				opacity: 1;
			}

			.tip-name {
				display: block;
				margin-bottom: 0.28rem;
				color: #eaf4ff;
				font-size: 0.8rem;
				letter-spacing: 0.2em;
			}

			.tip-meta {
				color: rgba(122, 204, 255, 0.66);
				font-size: 0.625rem;
				letter-spacing: 0.16em;
			}

			@media (max-width: 640px) {
				.hud-tl {
					top: 1.1rem;
					left: 1.1rem;
				}

				.hud-bl {
					bottom: 1.1rem;
					left: 1.1rem;
				}

				.hud-br {
					display: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.nebula,
				#sky {
					animation: none;
				}
			}
		</style>
	</head>

	<body>
		<div class="nebula nebula-a"></div>
		<div class="nebula nebula-b"></div>

		<canvas id="sky"></canvas>

		<div class="vignette"></div>

		<div class="hud hud-tl">
			<span class="hud-title">STARMAP</span>
			<span class="hud-dim">v0.1 / canvas-2d</span>
		</div>

		<div class="hud hud-bl">
			<span id="hud-nodes">—</span>
			<span class="hud-dim">nodes</span>
			<span class="hud-sep">/</span>
			<span id="hud-fps">—</span>
			<span class="hud-dim">fps</span>
		</div>

		<div class="hud hud-br">move to parallax · hover a node</div>

		<div class="tip" id="tip">
			<span class="tip-name" id="tip-name"></span>
			<span class="tip-meta" id="tip-meta"></span>
		</div>

		<script>
			(() => {
				'use strict';

				const canvas = document.getElementById('sky');
				const ctx = canvas.getContext('2d', { alpha: true });
				const tip = document.getElementById('tip');
				const tipName = document.getElementById('tip-name');
				const tipMeta = document.getElementById('tip-meta');
				const hudNodes = document.getElementById('hud-nodes');
				const hudFps = document.getElementById('hud-fps');

				// 想调效果改这里就够了
				const CONFIG = {
					starCount: 620, // 星系主体星点数量
					haloRatio: 0.12, // 其中多少比例散在盘外
					spinSpeed: 0.15, // 自转角速度 rad/s（约 42 秒一圈）
					tilt: 34, // 俯角，度
					connectK: 3, // 每个星连几个邻居
					maxEdge: 0.16, // 超过这个距离不连线（越小越紧凑）
					bgStars: 780, // 远景星野数量（会按屏幕面积缩放）
					parallax: 0.06, // 鼠标视差强度（弧度）
				};

				const TAU = Math.PI * 2;
				const CAM_D = 3; // 相机距离（星系半径 = 1）
				const DPR_MAX = 2;
				const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

				const stars = [];
				const edges = [];
				const bg = [];

				let W = 1;
				let H = 1;
				let dpr = 1;
				let centerX = 0;
				let centerY = 0;
				let focal = 1000;
				let yaw = 0;

				let hx = -1e4;
				let hy = -1e4;
				let hover = null;
				let needsPick = false;
				let tipW = 0;
				let tipH = 0;

				let mx = 0;
				let my = 0;
				let tmx = 0;
				let tmy = 0;

				let lastT = 0;
				let rafId = 0;
				let fpsFrames = 0;
				let fpsTime = 0;
				let spinFactor = 1; // hover 时放慢自转，星星才不会从指针下漂走

				const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

				function gauss() {
					let u = 0;
					let v = 0;
					while (u === 0) u = Math.random();
					while (v === 0) v = Math.random();
					return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
				}

				// ---------- 预渲染发光精灵 ----------
				function makeSprite(r, g, b) {
					const S = 64;
					const c = document.createElement('canvas');
					c.width = c.height = S;
					const x = c.getContext('2d');
					const h = S / 2;
					const grad = x.createRadialGradient(h, h, 0, h, h, h);
					grad.addColorStop(0, 'rgba(255,255,255,1)');
					grad.addColorStop(0.09, `rgba(${r},${g},${b},0.98)`);
					grad.addColorStop(0.22, `rgba(${r},${g},${b},0.34)`);
					grad.addColorStop(0.48, `rgba(${r},${g},${b},0.09)`);
					grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
					x.fillStyle = grad;
					x.fillRect(0, 0, S, S);
					return c;
				}

				const SPRITES = [
					makeSprite(226, 238, 255), // 冷白
					makeSprite(150, 194, 255), // 蓝
					makeSprite(255, 220, 180), // 暖
					makeSprite(255, 190, 215), // 粉
				];

				const TYPE_LABEL = ['A-CLASS', 'B-CLASS', 'K-CLASS', 'M-CLASS'];

				// 连线按透明度分桶批量描边，避免每帧几千次 stroke
				const EDGE_BUCKETS = 14;
				const EDGE_MAX_A = 0.22;
				const edgeSegs = Array.from({ length: EDGE_BUCKETS }, () => []);
				let hotSegs = [];

				// 星系中心的柔光
				const CORE_GLOW = (() => {
					const S = 512;
					const c = document.createElement('canvas');
					c.width = c.height = S;
					const x = c.getContext('2d');
					const h = S / 2;
					const grad = x.createRadialGradient(h, h, 0, h, h, h);
					grad.addColorStop(0, 'rgba(96, 156, 224, 0.3)');
					grad.addColorStop(0.34, 'rgba(72, 122, 202, 0.13)');
					grad.addColorStop(0.7, 'rgba(52, 86, 160, 0.04)');
					grad.addColorStop(1, 'rgba(40, 70, 140, 0)');
					x.fillStyle = grad;
					x.fillRect(0, 0, S, S);
					return c;
				})();

				// ---------- 星系 ----------
				const DESIGNATIONS = 'ABCDEFGHKMNPRSTVX';

				function pickType() {
					const r = Math.random();
					if (r < 0.56) return 0;
					if (r < 0.8) return 1;
					if (r < 0.95) return 2;
					return 3;
				}

				function makeStar(x, y, z, i, warm = false) {
					return {
						x,
						y,
						z,
						size: 0.7 + Math.random() * 1.0,
						bright: 0.55 + Math.random() * 0.45,
						type: warm ? (Math.random() < 0.55 ? 2 : 0) : pickType(),
						phase: Math.random() * TAU,
						tw: 0.6 + Math.random() * 1.4,
						links: [],
						name: `${DESIGNATIONS[i % DESIGNATIONS.length]}-${100 + ((i * 137 + 41) % 860)}`,
						sx: 0,
						sy: 0,
						r: 1,
						dim: 1,
						a: 1,
						vis: false,
					};
				}

				function buildGalaxy() {
					stars.length = 0;
					const n = CONFIG.starCount;
					const halo = Math.round(n * CONFIG.haloRatio);
					const body = n - halo;

					for (let i = 0; i < body; i++) {
						let x;
						let y;
						let z;
						let warm = false;

						if (i < body * 0.24) {
							// 核球：密集、偏暖、略厚
							const r = Math.pow(Math.random(), 1.7) * 0.19;
							const a = Math.random() * TAU;
							x = Math.cos(a) * r;
							z = Math.sin(a) * r;
							y = gauss() * 0.045;
							warm = true;
						} else if (i < body * 0.36) {
							// 盘面弥散星：填满旋臂之间的空隙
							const r = Math.sqrt(Math.random()) * 0.98;
							const a = Math.random() * TAU;
							x = Math.cos(a) * r;
							z = Math.sin(a) * r;
							y = gauss() * 0.03;
						} else {
							// 两条对数螺旋臂，角度扰动收紧才能读成「臂」
							const t = 0.12 + 0.88 * Math.pow(Math.random(), 0.75);
							const a = (i % 2) * Math.PI + t * 3.15 + gauss() * 0.24;
							x = Math.cos(a) * t + gauss() * 0.022;
							z = Math.sin(a) * t + gauss() * 0.022;
							y = gauss() * 0.02;
						}

						stars.push(makeStar(x, y, z, i, warm));
					}

					// 盘外晕
					for (let i = 0; i < halo; i++) {
						const a = Math.random() * TAU;
						const r = 1.02 + Math.random() * 0.55;
						stars.push(
							makeStar(Math.cos(a) * r, gauss() * 0.16, Math.sin(a) * r, body + i),
						);
					}

					// 少量「主角星」，作为视觉锚点
					for (let i = 0; i < 5; i++) {
						const s = stars[Math.floor(Math.random() * stars.length)];
						s.size = 2.3 + Math.random() * 1.1;
						s.bright = 1;
					}

					buildLinks();
				}

				function buildLinks() {
					edges.length = 0;
					const seen = new Set();
					const maxD2 = CONFIG.maxEdge * CONFIG.maxEdge;
					for (const s of stars) s.links.length = 0;

					for (let i = 0; i < stars.length; i++) {
						const a = stars[i];
						const cand = [];
						for (let j = 0; j < stars.length; j++) {
							if (j === i) continue;
							const b = stars[j];
							const dx = a.x - b.x;
							const dy = a.y - b.y;
							const dz = a.z - b.z;
							const d2 = dx * dx + dy * dy + dz * dz;
							if (d2 < maxD2) cand.push([d2, j]);
						}
						cand.sort((p, q) => p[0] - q[0]);

						const k = Math.min(CONFIG.connectK, cand.length);
						for (let n = 0; n < k; n++) {
							const j = cand[n][1];
							const key = i < j ? `${i}-${j}` : `${j}-${i}`;
							if (seen.has(key)) continue;
							seen.add(key);
							edges.push([i, j, Math.sqrt(cand[n][0])]);
							a.links.push(stars[j]);
							stars[j].links.push(a);
						}
					}
				}

				// ---------- 远景星野 ----------
				function buildBackdrop() {
					bg.length = 0;
					const area = W * H;
					const n = Math.round(
						clamp(760 * Math.sqrt(area / (1440 * 900)), 220, 1300),
					);
					for (let i = 0; i < n; i++) {
						bg.push({
							x: Math.random(),
							y: Math.random(),
							r: Math.random() < 0.84 ? 1 : 1.7,
							a: 0.1 + Math.random() * 0.55,
							ph: Math.random() * TAU,
							sp: 0.4 + Math.random() * 1.6,
						});
					}
				}

				function drawBackdrop(t) {
					const ox = -mx * 24;
					const oy = -my * 16;

					ctx.globalCompositeOperation = 'source-over';
					ctx.fillStyle = 'rgb(205, 222, 255)';

					for (let i = 0; i < bg.length; i++) {
						const b = bg[i];
						const tw = reduced ? 1 : 0.7 + 0.3 * Math.sin(t * b.sp + b.ph);
						ctx.globalAlpha = b.a * tw;
						let x = (b.x * W + ox) % W;
						let y = (b.y * H + oy) % H;
						if (x < 0) x += W;
						if (y < 0) y += H;
						ctx.fillRect(x, y, b.r, b.r);
					}
					ctx.globalAlpha = 1;
				}

				// ---------- 渲染 ----------
				function render(t) {
					ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
					ctx.clearRect(0, 0, W, H);

					drawBackdrop(t);

					const cosS = Math.cos(yaw + mx * CONFIG.parallax);
					const sinS = Math.sin(yaw + mx * CONFIG.parallax);
					const tiltA = tiltRad + my * 0.045;
					const cosT = Math.cos(tiltA);
					const sinT = Math.sin(tiltA);

					// 投影所有星点
					for (let i = 0; i < stars.length; i++) {
						const s = stars[i];

						// 绕 Y 轴自转
						const x1 = s.x * cosS + s.z * sinS;
						const z1 = -s.x * sinS + s.z * cosS;
						// 绕 X 轴倾斜（俯视）
						const y2 = s.y * cosT - z1 * sinT;
						const z2 = s.y * sinT + z1 * cosT;

						const zp = z2 + CAM_D;
						if (zp < 0.3) {
							s.vis = false;
							continue;
						}

						const k = focal / zp;
						const sx = centerX + x1 * k;
						const sy = centerY - y2 * k;

						s.sx = sx;
						s.sy = sy;
						s.dim = CAM_D / zp; // 近处 > 1，远处 < 1
						s.r = s.size * s.dim;
						s.vis = sx > -80 && sx < W + 80 && sy > -80 && sy < H + 80;

						const tw = reduced ? 1 : 0.86 + 0.14 * Math.sin(t * s.tw + s.phase);
						s.a = 0.9 * s.bright * Math.min(1, s.dim) * tw;
					}

					ctx.globalCompositeOperation = 'lighter';

					// 星系核心柔光
					const R = focal / CAM_D;
					const gw = R * 2.9;
					ctx.save();
					ctx.translate(centerX, centerY);
					ctx.scale(1, 0.62);
					ctx.globalAlpha = 1;
					ctx.drawImage(CORE_GLOW, -gw / 2, -gw / 2, gw, gw);
					ctx.restore();

					// 星际连线
					ctx.lineWidth = 1;
					for (let i = 0; i < EDGE_BUCKETS; i++) edgeSegs[i].length = 0;
					hotSegs = [];

					for (let i = 0; i < edges.length; i++) {
						const e = edges[i];
						const a = stars[e[0]];
						const b = stars[e[1]];
						if (!a.vis || !b.vis) continue;

						const hot = hover !== null && (a === hover || b === hover);
						let al =
							0.2 *
							Math.min(1, Math.min(a.dim, b.dim)) *
							(1 - (e[2] / CONFIG.maxEdge) * 0.78);
						if (hover) al *= hot ? 3.4 : 0.42;
						if (al < 0.008) continue;

						if (hot) {
							hotSegs.push(a.sx, a.sy, b.sx, b.sy);
						} else {
							const bi = Math.min(
								EDGE_BUCKETS - 1,
								Math.max(0, Math.floor((al / EDGE_MAX_A) * EDGE_BUCKETS)),
							);
							const arr = edgeSegs[bi];
							arr.push(a.sx, a.sy, b.sx, b.sy);
						}
					}

					for (let bi = 0; bi < EDGE_BUCKETS; bi++) {
						const arr = edgeSegs[bi];
						if (!arr.length) continue;
						const a = (((bi + 0.5) / EDGE_BUCKETS) * EDGE_MAX_A).toFixed(3);
						ctx.strokeStyle = `rgba(132, 176, 232, ${a})`;
						ctx.beginPath();
						for (let i = 0; i < arr.length; i += 4) {
							ctx.moveTo(arr[i], arr[i + 1]);
							ctx.lineTo(arr[i + 2], arr[i + 3]);
						}
						ctx.stroke();
					}

					if (hotSegs.length) {
						// 先画一层宽的柔光，再压一层亮线
						ctx.beginPath();
						for (let i = 0; i < hotSegs.length; i += 4) {
							ctx.moveTo(hotSegs[i], hotSegs[i + 1]);
							ctx.lineTo(hotSegs[i + 2], hotSegs[i + 3]);
						}
						ctx.strokeStyle = 'rgba(110, 200, 255, 0.22)';
						ctx.lineWidth = 4;
						ctx.stroke();

						ctx.strokeStyle = 'rgba(186, 240, 255, 1)';
						ctx.lineWidth = 1.2;
						ctx.stroke();
						ctx.lineWidth = 1;
					}

					// 星点
					for (let i = 0; i < stars.length; i++) {
						const s = stars[i];
						if (!s.vis) continue;

						let a = s.a;
						if (hover && s !== hover) {
							a *= s.links.indexOf(hover) >= 0 ? 1 : 0.5;
						}
						if (a <= 0.01) continue;

						const isHot = s === hover;
						const w = Math.max(2.5, s.r * 8.5) * (isHot ? 1.55 : 1);
						ctx.globalAlpha = isHot ? 1 : Math.min(1, a);
						ctx.drawImage(SPRITES[s.type], s.sx - w / 2, s.sy - w / 2, w, w);
					}

					ctx.globalAlpha = 1;

					// 选中态：环 + 四向刻度
					if (hover && hover.vis) {
						const r = Math.max(11, hover.r * 3 + 7);
						ctx.strokeStyle = 'rgba(130, 218, 255, 0.95)';
						ctx.lineWidth = 1;

						ctx.globalAlpha = 0.85;
						ctx.beginPath();
						ctx.arc(hover.sx, hover.sy, r, 0, TAU);
						ctx.stroke();

						ctx.globalAlpha = 0.3;
						ctx.beginPath();
						ctx.arc(hover.sx, hover.sy, r + 6, 0, TAU);
						ctx.stroke();

						ctx.globalAlpha = 0.7;
						ctx.beginPath();
						ctx.moveTo(hover.sx - r - 14, hover.sy);
						ctx.lineTo(hover.sx - r - 5, hover.sy);
						ctx.moveTo(hover.sx + r + 5, hover.sy);
						ctx.lineTo(hover.sx + r + 14, hover.sy);
						ctx.moveTo(hover.sx, hover.sy - r - 14);
						ctx.lineTo(hover.sx, hover.sy - r - 5);
						ctx.moveTo(hover.sx, hover.sy + r + 5);
						ctx.lineTo(hover.sx, hover.sy + r + 14);
						ctx.stroke();
					}

					ctx.globalAlpha = 1;
					ctx.globalCompositeOperation = 'source-over';
				}

				// ---------- 拾取 ----------
				// 只在指针移动时重新判定，避免星图自转把 hover 抖掉
				function pick(force) {
					if (!force && !needsPick) {
						if (hover && !hover.vis) {
							hover = null;
							tip.classList.remove('on');
						} else if (hover) {
							placeTip();
						}
						return;
					}
					needsPick = false;

					let best = null;
					let bestD = Infinity;

					for (let i = 0; i < stars.length; i++) {
						const s = stars[i];
						if (!s.vis) continue;
						const dx = s.sx - hx;
						const dy = s.sy - hy;
						const d2 = dx * dx + dy * dy;
						const R = Math.max(12, s.r * 2 + 8);
						if (d2 < R * R && d2 < bestD) {
							bestD = d2;
							best = s;
						}
					}

					if (best !== hover) {
						hover = best;
						if (best) {
							tipName.textContent = best.name;
							tipMeta.textContent = `${best.links.length} LINKS · ${TYPE_LABEL[best.type]}`;
							tip.classList.add('on');
							tipW = tip.offsetWidth;
							tipH = tip.offsetHeight;
						} else {
							tip.classList.remove('on');
						}
					}

					if (best) placeTip();
				}

				function placeTip() {
					if (!hover || !hover.vis) return;
					let x = hover.sx + 24;
					let y = hover.sy - tipH / 2;
					if (x + tipW > W - 12) x = hover.sx - tipW - 24;
					y = clamp(y, 12, H - tipH - 12);
					tip.style.transform = `translate3d(${x}px, ${y}px, 0)`;
				}

				// ---------- 循环 ----------
				const tiltRad = (CONFIG.tilt * Math.PI) / 180;

				function loop(tms) {
					rafId = requestAnimationFrame(loop);

					const t = tms / 1000;
					const dt = lastT ? Math.min(0.05, t - lastT) : 0;
					lastT = t;

					if (!reduced) {
						const target = hover ? 0.15 : 1;
						spinFactor += (target - spinFactor) * Math.min(1, dt * 5);
						yaw += CONFIG.spinSpeed * dt * spinFactor;
					}
					mx += (tmx - mx) * 0.05;
					my += (tmy - my) * 0.05;

					render(t);
					pick();
					fpsFrames++;
					if (t - fpsTime > 0.5) {
						hudFps.textContent = String(Math.round(fpsFrames / (t - fpsTime)));
						fpsFrames = 0;
						fpsTime = t;
					}
				}

				// ---------- 尺寸与输入 ----------
				function resize() {
					dpr = Math.min(window.devicePixelRatio || 1, DPR_MAX);
					W = window.innerWidth;
					H = window.innerHeight;
					canvas.width = Math.round(W * dpr);
					canvas.height = Math.round(H * dpr);
					ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
					centerX = W / 2;
					centerY = H * 0.5;
					focal = Math.min(W * (W < 640 ? 1.18 : 1), H * 1.15);
					buildBackdrop();
				}

				function onMove(e) {
					hx = e.clientX;
					hy = e.clientY;
					tmx = clamp((e.clientX / W) * 2 - 1, -1, 1);
					tmy = clamp((e.clientY / H) * 2 - 1, -1, 1);
					needsPick = true;
				}

				window.addEventListener('pointermove', onMove, { passive: true });
				window.addEventListener('pointerdown', onMove, { passive: true });
				window.addEventListener('pointerleave', () => {
					hx = -1e4;
					hy = -1e4;
					tmx = 0;
					tmy = 0;
					needsPick = true;
				});

				document.addEventListener('visibilitychange', () => {
					if (document.hidden) {
						cancelAnimationFrame(rafId);
						rafId = 0;
					} else if (!rafId) {
						lastT = 0;
						rafId = requestAnimationFrame(loop);
					}
				});

				resize();
				buildGalaxy();
				hudNodes.textContent = String(stars.length);
				window.addEventListener('resize', resize);
				rafId = requestAnimationFrame(loop);

				// 方便在控制台里实时调参
				window.STARMAP = { CONFIG, stars, edges, rebuild: buildGalaxy };
			})();
		</script>
	</body>
</html>
